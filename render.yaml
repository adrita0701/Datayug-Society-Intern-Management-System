# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: datayug-intern-portal
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_BASE_PATH
        value: /
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: datayug-intern-db
          property: connectionString

databases:
  - name: datayug-intern-db
    region: singapore
    plan: free
